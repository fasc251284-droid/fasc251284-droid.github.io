<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --azul:#14304f; --azul2:#1d4470; --oro:#d4af37; --oro-suave:#f6ecd0;
  --fondo:#eef1f5; --panel:#fff; --linea:#dde3ea;
  --txt:#1b2733; --txt2:#61707f;
  --ok:#1f8a5b; --alerta:#d98a00; --mal:#c1442e;
  --r:14px;
}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--fondo); color:var(--txt); font-size:15px; line-height:1.4;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));

header{

.hdr-top{display:flex;align-items:center;gap:10px}

.cursos::-webkit-scrollbar{display:none}
.chip-curso{background:rgba(255,255,255,.13);color:#fff;border:1px solid rgba(255,255,255,.18);
  padding:6px 13px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip-curso.on{background:var(--oro);color:var(--azul);border-color:var(--oro)}
main{max-width:680px;margin:0 auto;padding:14px 12px 20px}
.card{background:var(--panel);border-radius:var(--r);padding:14px;margin-bottom:12px;

.card h2{margin:0 0 10px;font-size:13.5px;font-weight:700;color:var(--azul);

.sub{font-size:12px;color:var(--txt2);margin:-4px 0 10px}

.campo{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;
  font-size:15px;margin-bottom:10px;background:#fff;color:var(--txt);font-family:inherit}

.tests::-webkit-scrollbar{display:none}
.chip-test{background:#fff;border:1px solid var(--linea);padding:8px 12px;border-radius:10px;
  font-size:12.5px;font-weight:600;white-space:nowrap;cursor:pointer;color:var(--txt2)}
.chip-test.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.fila{display:flex;align-items:center;gap:7px;padding:9px 0;border-bottom:1px solid var(--linea)}
.fila:last-child{border-bottom:none}
.fila .nom{flex:1;min-width:0;font-size:12.5px;font-weight:600;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inp{width:64px;padding:8px 4px;border:1px solid var(--linea);border-radius:9px;text-align:center;
  font-size:15px;font-weight:600;background:#fafbfc;color:var(--txt);font-family:inherit;flex:0 0 auto}
.inp:focus{outline:none;border-color:var(--oro);background:#fff;box-shadow:0 0 0 3px rgba(212,175,55,.18)}
.opts{display:flex;gap:3px;flex:0 0 auto}
.opt{height:34px;border-radius:8px;border:1px solid var(--linea);background:#fafbfc;
  font-size:11px;font-weight:700;color:var(--txt2);cursor:pointer;padding:0;font-family:inherit}
.opt.on-L,.opt.on-S{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.on-NL,.opt.on-NS{background:var(--mal);border-color:var(--mal);color:#fff}
.opt.on-P{background:var(--alerta);border-color:var(--alerta);color:#fff}
.cab{display:flex;gap:7px;padding-bottom:6px;border-bottom:2px solid var(--azul);margin-bottom:2px}
.cab .nom{flex:1;font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.cab .col{text-align:center;font-size:10px;color:var(--azul);font-weight:700;flex:0 0 auto}
.delta{width:40px;text-align:center;font-size:11px;font-weight:700;flex:0 0 auto}
.up{color:var(--ok)} .down{color:var(--mal)} .eq{color:var(--txt2)}
.barra{height:7px;background:#e6ebf1;border-radius:4px;overflow:hidden;margin-top:6px}
.barra i{display:block;height:100%;background:var(--azul);border-radius:4px}
.barra i.oro{background:var(--oro)}
.bloque{padding:11px 0;border-bottom:1px solid var(--linea)}
.bloque:last-child{border-bottom:none}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bh b{font-size:13.5px}
.bh span{font-size:12px;color:var(--txt2)}
.bd{display:flex;gap:16px;margin-top:6px;font-size:11.5px;color:var(--txt2)}
.bd b{color:var(--azul);font-size:15px;display:block;line-height:1.2}
.dist{display:flex;height:26px;border-radius:8px;overflow:hidden;margin-top:8px}
.dist div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;min-width:0}
.leyenda{display:flex;gap:12px;margin-top:7px;font-size:11px;color:var(--txt2);flex-wrap:wrap}
.leyenda i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px}
.btn{display:block;width:100%;padding:12px;border-radius:11px;border:none;background:var(--azul);
  color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit}
.btn.oro{background:var(--oro);color:var(--azul)}
.btn.linea{background:#fff;color:var(--azul);border:1.5px solid var(--azul)}
.btn.peligro{background:#fff;color:var(--mal);border:1.5px solid var(--mal)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linea);
  display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 12px rgba(20,48,79,.08)}
nav button{flex:1;background:none;border:none;padding:9px 2px 8px;font-family:inherit;
  font-size:10.5px;font-weight:600;color:var(--txt2);cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px}
nav button.on{color:var(--azul)}
nav button.on .ico{background:var(--oro-suave)}
.ico{width:30px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.velo{position:fixed;inset:0;background:rgba(15,30,48,.5);z-index:60;display:none;
  align-items:flex-end;justify-content:center}
.velo.on{display:flex}
.hoja{background:var(--fondo);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;
  border-radius:18px 18px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:sube .22s ease}
@keyframes sube{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.hoja{animation:none}}
.hoja-h{background:var(--azul);color:#fff;padding:15px;border-radius:18px 18px 0 0;
  position:sticky;top:0;display:flex;align-items:flex-start;gap:10px;z-index:2}
.hoja-h h3{margin:0;font-size:14.5px;line-height:1.3;flex:1}
.hoja-h small{opacity:.7;font-size:11.5px;font-weight:400}
.cerrar{background:rgba(255,255,255,.15);border:none;color:#fff;width:30px;height:30px;
  border-radius:8px;font-size:16px;cursor:pointer;flex:0 0 auto}
.hoja-b{padding:12px}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.p-ok{background:#e3f3eb;color:var(--ok)} .p-mal{background:#fbe6e2;color:var(--mal)}
.p-med{background:#fcf1dc;color:var(--alerta)} .p-neutro{background:#eef1f5;color:var(--txt2)}
.vacio{text-align:center;padding:26px 14px;color:var(--txt2);font-size:13px;line-height:1.6}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--azul);
  color:#fff;padding:10px 18px;border-radius:22px;font-size:13px;font-weight:600;z-index:80;
  opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center}
.toast.on{opacity:1}
.syncb{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff}
.syncb.ok{background:rgba(76,214,142,.22);color:#bdf3d8}
.syncb.err{background:rgba(255,140,120,.22);color:#ffd2c8}
@media print{header,nav,.no-print{display:none!important}body{background:#fff;padding:0}}
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <div class="escudo">JPII</div>
    <div class="hdr-txt">
      <h1>Test de Condición Física</h1>
      <p>Colegio Juan Pablo Segundo · Ed. Física y Salud</p>
      <span class="syncb" id="syncb">Solo en este equipo</span>
    </div>
  </div>
  <div class="cursos" id="cursos"></div>
</header>

<main id="app"></main>

<nav>
  <button data-tab="inicio" class="on"><span class="ico">👥</span>Curso</button>
  <button data-tab="registrar"><span class="ico">✏️</span>Registrar</button>
  <button data-tab="resumen"><span class="ico">📊</span>Resumen</button>
  <button data-tab="datos"><span class="ico">💾</span>Datos</button>
</nav>

<div class="velo" id="velo"><div class="hoja" id="hoja"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ======================= TESTS ======================= */
var TESTS = [
  {id:'velocidad', nom:'Velocidad 20 metros', corto:'Velocidad', uni:'s', mejor:'menor', dec:2,
   campos:[{k:'m1', l:'Marca', t:'num'}, {k:'ev', l:'Logro', t:'opt', op:['S','NS']}]},
  {id:'salto', nom:'Test de salto', corto:'Salto', uni:'cm', mejor:'mayor', dec:2,
   campos:[{k:'m1', f:1, t:'num'}, {k:'m2', f:2, t:'num'}]},
  {id:'abdominales', nom:'Test de abdominales', corto:'Abdominales', uni:'rep', mejor:'mayor', dec:0,
   campos:[{k:'m1', f:1, t:'int'}, {k:'m2', f:2, t:'int'}]},
  {id:'plancha', nom:'Plancha', corto:'Plancha', uni:'', mejor:'mayor', dec:0,
   campos:[{k:'m1', f:1, t:'opt', op:['L','NL','P']}, {k:'m2', f:2, t:'opt', op:['L','NL','P']}]},
  {id:'flexiones', nom:'Flexiones de brazo (handball)', corto:'Flexiones', uni:'', esNota:true, dec:1,
   campos:[{k:'m1', l:'Nota', t:'nota'}]},
  {id:'trote', nom:'Trote', corto:'Trote', uni:'', esNota:true, dec:1,
   campos:[{k:'m1', l:'Nota', t:'nota'}]}
];
function T(id){ for(var i=0;i<TESTS.length;i++){ if(TESTS[i].id===id) return TESTS[i]; } return TESTS[0]; }

/* ============ DATOS 5º BÁSICO (planilla 2026) ============
   nombre, velocidad, logro, salto1, salto2, abd1, abd2, plancha1, plancha2, flexiones, trote */
var D5 = [
["Aranzave Montecinos Amanda",3.98,"S",20.14,26.29,20,20,"L","L",6.3,6.9],
["Barrios Parra José Emiliano",4.54,"S",11.88,15.83,15,19,"L","L",5.2,7.0],
["Chávez Aguilera Mía Bella",4.32,null,17.88,18.94,19,17,"P",null,6.5,null],
["Cornejo Kushner Emma Antonia",4.07,"S",18.99,22.46,31,27,"L","L",5.8,null],
["Coronado Carmona Emily Pascal",4.13,"S",20.14,20.16,19,18,"L","NL",7.0,null],
["Fuentealba León Alexa Anaís",4.48,"S",16.85,19.02,17,15,"L","L",6.3,null],
["Gamboa Escobar Ayleen Elizabeth",4.98,null,12.01,11.11,10,13,"NL","NL",6.3,null],
["Jaramillo Chico Maite Ainnara",3.80,"S",23.72,25.04,16,19,"L","L",7.0,null],
["Jaramillo Flores Elizabeth",5.28,null,9.50,7.25,8,13,"NL","NL",5.2,null],
["Jofré Cifuentes Angelo Antonio",5.03,null,11.08,14.79,20,19,"NL","NL",5.6,null],
["Mancilla Leiva David Alonso",4.34,"NS",14.84,14.81,15,12,"L","L",7.0,null],
["Obando Molina Monserrat Cristel",4.60,"NS",11.99,10.28,14,14,"L","L",5.6,null],
["Osorio Muñoz Francisca Paz",4.10,"S",18.99,19.02,23,22,"NL","L",7.0,null],
["Pailapichún Hernández Catalina",3.77,"S",22.53,29.02,19,15,"L","L",6.3,null],
["Peña Araneda Emma Ignacia",4.16,"S",7.24,13.83,15,20,"P","L",5.9,null],
["Pérez Silva Florencia Katalina",3.96,"S",15.81,21.29,18,18,"L","L",7.0,null],
["Pérez Vera Dalma Yhizel",3.94,"S",15.80,19.02,17,19,"L","L",7.0,null],
["Sáez Villegas Jacob Alexsander",4.94,"S",10.26,11.97,6,16,"NL","NL",7.0,null],
["Saldía Ortiz Jorge Maximiliano",4.86,"S",9.45,14.82,18,25,"L","L",7.0,null],
["Santibáñez Somoza Maite Anyelina",4.34,"S",19.05,25.04,18,21,"L","L",6.3,null],
["Soto Cea Mayte Isabel",4.62,"S",15.85,17.97,19,20,"L","L",7.0,null],
["Vásquez Riffo Sarai Elizabeth",null,"S",15.81,22.52,18,20,"L","L",7.0,null],
["Salgado Martina",null,null,10.00,13.81,16,13,"NL","L",5.4,null]
];

/* ======================= ESTADO ======================= */
var KEY='cjp2_tcf_v1';
var ST, tab='inicio', testOn='velocidad', filtro='';

function uid(p){ return p + Math.random().toString(36).slice(2,9); }
function nuevoCurso(nombre){ return {id:uid('c'), nombre:nombre, f1:'14/04', f2:'12/05', alumnos:[]}; }
function semilla(){
  var c5 = nuevoCurso('5º Básico');
  c5.alumnos = D5.map(function(r){
    return {id:uid('a'), nombre:r[0], d:{
      velocidad:{m1:r[1], ev:r[2]},
      salto:{m1:r[3], m2:r[4]},
      abdominales:{m1:r[5], m2:r[6]},
      plancha:{m1:r[7], m2:r[8]},
      flexiones:{m1:r[9]},
      trote:{m1:r[10]}
    }};
  });
  return {cursos:[c5, nuevoCurso('6º Básico'), nuevoCurso('7º Básico'), nuevoCurso('8º Básico')], activo:c5.id};
}
function guardar(){ ST._ts = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){}
  subirLuego(); }

/* ======================= SUPABASE ======================= */
var SKEY='cjp2_tcf_sync';
var SY = (function(){ try{ var x=JSON.parse(localStorage.getItem(SKEY)); if(x) return x; }catch(e){}
  return {url:'https://oktinlfoxjdohjukhwqw.supabase.co', key:'', tabla:'test_fisico', doc:'cjp2-2026'}; })();
function guardarSY(){ try{ localStorage.setItem(SKEY, JSON.stringify(SY)); }catch(e){} }
function syListo(){ return !!(SY.url && SY.key && SY.tabla && SY.doc); }
function cab(){ return {apikey:SY.key, Authorization:'Bearer '+SY.key, 'Content-Type':'application/json'}; }
function badge(cl, txt){ var b=document.getElementById('syncb'); if(!b) return;
  b.className='syncb'+(cl?' '+cl:''); b.textContent=txt; }

var tPush=null;
function subirLuego(){ if(!syListo()) return; clearTimeout(tPush); tPush=setTimeout(subir, 1500); }

function subir(aviso){
  if(!syListo()){ if(aviso) toast('Falta configurar la conexión'); return; }
  badge('', 'Guardando en la nube…');
  fetch(SY.url+'/rest/v1/'+SY.tabla, {method:'POST',
    headers:{apikey:SY.key, Authorization:'Bearer '+SY.key, 'Content-Type':'application/json',
             Prefer:'resolution=merge-duplicates,return=minimal'},
    body: JSON.stringify([{id:SY.doc, datos:ST, actualizado: new Date().toISOString()}])
  }).then(function(r){
    if(!r.ok) return r.text().then(function(t){ throw new Error(t); });
    badge('ok','Sincronizado'); if(aviso) toast('Datos subidos');
  }).catch(function(e){ badge('err','Sin subir'); if(aviso) toast('No se pudo subir: revisa la tabla y la clave'); });
}

function bajar(aviso){
  if(!syListo()){ if(aviso) toast('Falta configurar la conexión'); return; }
  badge('', 'Buscando cambios…');
  fetch(SY.url+'/rest/v1/'+SY.tabla+'?id=eq.'+encodeURIComponent(SY.doc)+'&select=datos', {headers:cab()})
  .then(function(r){ if(!r.ok) return r.text().then(function(t){ throw new Error(t); }); return r.json(); })
  .then(function(j){
    if(j.length && j[0].datos){
      var rem=j[0].datos;
      if((rem._ts||0) > (ST._ts||0)){
        ST=rem; try{ localStorage.setItem(KEY, JSON.stringify(ST)); }catch(e){}
        render(); badge('ok','Sincronizado'); toast('Se cargaron los datos más recientes'); return;
      }
      if((ST._ts||0) > (rem._ts||0)){ subir(false); return; }
      badge('ok','Sincronizado'); if(aviso) toast('Todo al día');
    } else { subir(false); if(aviso) toast('Primera carga enviada a la nube'); }
  }).catch(function(e){ badge('err','Sin conexión'); if(aviso) toast('No se pudo conectar con Supabase'); });
}
function cargar(){ try{ var x=localStorage.getItem(KEY); if(x) return JSON.parse(x); }catch(e){} return null; }
ST = cargar() || semilla();
function curso(){
  for(var i=0;i<ST.cursos.length;i++){ if(ST.cursos[i].id===ST.activo) return ST.cursos[i]; }
  return ST.cursos[0];
}

/* ======================= UTILIDADES ======================= */
function esc(s){ return String(s===null||s===undefined?'':s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(n,dec){ if(typeof n!=='number'||isNaN(n)) return '–';
  return n.toFixed(dec===undefined?2:dec).replace('.',','); }
function pnum(s){ if(s===''||s===null||s===undefined) return null;
  var n=parseFloat(String(s).replace(',','.')); return isNaN(n)?null:n; }
function etiqueta(cp){ if(cp.f) return cp.f===1 ? curso().f1 : curso().f2; return cp.l||''; }
function val(a,tid,k){ return (a.d && a.d[tid] && a.d[tid][k]!==undefined) ? a.d[tid][k] : null; }
function setVal(a,tid,k,v){ if(!a.d) a.d={}; if(!a.d[tid]) a.d[tid]={}; a.d[tid][k]=v; guardar(); }
function prom(arr){ var v=arr.filter(function(x){return typeof x==='number'&&!isNaN(x);});
  if(!v.length) return null; return v.reduce(function(s,x){return s+x;},0)/v.length; }
function colorNota(n){ if(typeof n!=='number') return 'p-neutro'; if(n<4) return 'p-mal'; if(n<5.5) return 'p-med'; return 'p-ok'; }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._i); t._i=setTimeout(function(){t.classList.remove('on');},1800); }
function lista(){ var f=filtro.toLowerCase().trim();
  return curso().alumnos.filter(function(a){ return a.nombre.toLowerCase().indexOf(f)>=0; }); }
function notaGlobal(a){ return prom([val(a,'flexiones','m1'), val(a,'trote','m1')]); }
function progreso(a,t){
  if(t.esNota || t.id==='velocidad') return null;
  var v1=val(a,t.id,'m1'), v2=val(a,t.id,'m2');
  if(t.id==='plancha'){
    var r={NL:0,P:1,L:2};
    if(!(v1 in r) || !(v2 in r)) return null;
    return r[v2]-r[v1];
  }
  if(typeof v1!=='number' || typeof v2!=='number') return null;
  var d=v2-v1;
  return t.mejor==='menor' ? -d : d;
}

/* ======================= RENDER ======================= */
function render(){
  var chips='';
  ST.cursos.forEach(function(c){
    chips += '<div class="chip-curso '+(c.id===ST.activo?'on':'')+'" data-c="'+c.id+'">'+esc(c.nombre)+'</div>';
  });
  chips += '<div class="chip-curso" data-c="nuevo">+ Curso</div>';
  document.getElementById('cursos').innerHTML = chips;

  var bs=document.querySelectorAll('nav button');
  for(var i=0;i<bs.length;i++){ bs[i].classList.toggle('on', bs[i].getAttribute('data-tab')===tab); }

  document.getElementById('app').innerHTML =
    tab==='inicio' ? vInicio() : tab==='registrar' ? vRegistrar() :
    tab==='resumen' ? vResumen() : vDatos();
}

/* ---------- CURSO ---------- */
function vInicio(){
  var c=curso(), al=c.alumnos;
  if(!al.length) return '<div class="card"><h2>'+esc(c.nombre)+'</h2>'+
    '<div class="vacio">Todavía no hay estudiantes en este curso.<br>Agrégalos desde la pestaña <b>Datos</b>.</div></div>';

  var notas = al.map(notaGlobal);
  var conNota = notas.filter(function(n){return typeof n==='number';});
  var aprob = conNota.filter(function(n){return n>=4;}).length;
  var mejoraron = al.filter(function(a){
    return TESTS.some(function(t){ var p=progreso(a,t); return p!==null && p>0; });
  }).length;

  var filas = lista().map(function(a){
    var i = al.indexOf(a)+1;
    var v=val(a,'velocidad','m1'), s2=val(a,'salto','m2'), ab=val(a,'abdominales','m2');
    var pl=val(a,'plancha','m2') || val(a,'plancha','m1');
    var n=notaGlobal(a);
    var det=[];
    if(typeof v==='number') det.push(fmt(v,2)+' s');
    if(typeof s2==='number') det.push(fmt(s2,1)+' cm');
    if(typeof ab==='number') det.push(ab+' abd');
    if(pl) det.push('plancha '+pl);
    return '<div class="alumno" data-ficha="'+a.id+'">'+
      '<div class="num">'+i+'</div>'+
      '<div class="nom">'+esc(a.nombre)+'<div class="mini">'+(det.join(' · ')||'Sin registros')+'</div></div>'+
      '<span class="pill '+colorNota(n)+'">'+(typeof n==='number'?fmt(n,1):'–')+'</span>'+
      '<span class="flecha">›</span></div>';
  }).join('') || '<div class="vacio">Sin coincidencias para "'+esc(filtro)+'".</div>';

  return '<div class="kpis">'+
    '<div class="kpi"><b>'+al.length+'</b><span>Estudiantes</span></div>'+
    '<div class="kpi"><b>'+(conNota.length?fmt(prom(conNota),1):'–')+'</b><span>Promedio</span></div>'+
    '<div class="kpi"><b>'+(conNota.length?Math.round(aprob/conNota.length*100)+'%':'–')+'</b><span>Aprobación</span></div></div>'+
    '<div class="card"><h2>'+esc(c.nombre)+' · Nómina</h2>'+
    '<p class="sub">'+mejoraron+' de '+al.length+' mejoraron en al menos un test entre el '+esc(c.f1)+' y el '+esc(c.f2)+'. Toca un nombre para ver su ficha.</p>'+
    '<input class="campo" id="buscar" placeholder="Buscar estudiante…" value="'+esc(filtro)+'">'+
    filas+'</div>';
}

/* ---------- REGISTRAR ---------- */
function vRegistrar(){
  var c=curso(), t=T(testOn);
  var chips = TESTS.map(function(x){
    return '<div class="chip-test '+(x.id===testOn?'on':'')+'" data-t="'+x.id+'">'+x.corto+'</div>';
  }).join('');
  if(!c.alumnos.length) return '<div class="tests">'+chips+'</div>'+
    '<div class="card"><div class="vacio">Agrega estudiantes en <b>Datos</b> para empezar a registrar marcas.</div></div>';

  var conDelta = (t.id==='salto' || t.id==='abdominales' || t.id==='plancha');
  var anchoOpt = function(cp){ return cp.op.length>2 ? 78 : 72; };

  var cab = '<div class="cab"><div class="nom">Estudiante</div>' +
    t.campos.map(function(cp){
      var w = cp.t==='opt' ? anchoOpt(cp) : 64;
      return '<div class="col" style="width:'+w+'px">'+esc(etiqueta(cp))+'</div>';
    }).join('') +
    (conDelta ? '<div class="delta" style="color:var(--azul);font-size:10px">CAMBIO</div>' : '') + '</div>';

  var filas = lista().map(function(a){
    var cols = t.campos.map(function(cp){
      var v = val(a,t.id,cp.k);
      if(cp.t==='opt'){
        var w = anchoOpt(cp), bw = Math.floor((w-(cp.op.length-1)*3)/cp.op.length);
        return '<div class="opts" style="width:'+w+'px">' + cp.op.map(function(o){
          return '<button class="opt '+(v===o?'on-'+o:'')+'" style="width:'+bw+'px" data-set="'+a.id+'|'+t.id+'|'+cp.k+'|'+o+'">'+o+'</button>';
        }).join('') + '</div>';
      }
      var txt = (typeof v==='number') ? (cp.t==='int' ? v : String(v).replace('.',',')) : '';
      return '<input class="inp" inputmode="decimal" placeholder="–" value="'+txt+'" data-in="'+a.id+'|'+t.id+'|'+cp.k+'|'+cp.t+'">';
    }).join('');
    var d='';
    if(conDelta){
      var p=progreso(a,t);
      var cls = p===null?'eq':(p>0?'up':(p<0?'down':'eq'));
      var sim = p===null?'–':(p>0?'▲':(p<0?'▼':'='));
      d='<div class="delta '+cls+'">'+sim+'</div>';
    }
    return '<div class="fila"><div class="nom">'+esc(a.nombre)+'</div>'+cols+d+'</div>';
  }).join('') || '<div class="vacio">Sin coincidencias para "'+esc(filtro)+'".</div>';

  var ayuda = t.id==='plancha' ? 'L = logrado · NL = no logrado · P = pendiente'
    : t.id==='velocidad' ? 'S = satisfactorio · NS = no satisfactorio'
    : t.esNota ? 'Escala 1,0 a 7,0 con 60% de exigencia'
    : 'Se guarda solo. El cambio compara el ' + esc(c.f1) + ' con el ' + esc(c.f2) + '.';

  return '<div class="tests">'+chips+'</div>'+
    '<div class="card"><h2>'+esc(t.nom)+'</h2><p class="sub">'+ayuda+'</p>'+
    '<input class="campo" id="buscar" placeholder="Buscar estudiante…" value="'+esc(filtro)+'">'+
    cab+filas+'</div>';
}

/* ---------- RESUMEN ---------- */
function vResumen(){
  var c=curso(), al=c.alumnos;
  if(!al.length) return '<div class="card"><div class="vacio">Sin datos para resumir.</div></div>';

  var bloques = TESTS.map(function(t){
    if(t.id==='plancha'){
      var cuenta=function(k){ return {
        L: al.filter(function(a){return val(a,'plancha',k)==='L';}).length,
        NL:al.filter(function(a){return val(a,'plancha',k)==='NL';}).length,
        P: al.filter(function(a){return val(a,'plancha',k)==='P';}).length }; };
      var c1=cuenta('m1'), c2=cuenta('m2'), tot=c2.L+c2.NL+c2.P;
      if(!tot && !(c1.L+c1.NL+c1.P)) return '';
      var base = tot||1;
      return '<div class="bloque"><div class="bh"><b>'+t.nom+'</b><span>'+esc(c.f2)+'</span></div>'+
        '<div class="dist">'+
        '<div style="background:var(--ok);flex:'+(c2.L||0.001)+'">'+(c2.L||'')+'</div>'+
        '<div style="background:var(--alerta);flex:'+(c2.P||0.001)+'">'+(c2.P||'')+'</div>'+
        '<div style="background:var(--mal);flex:'+(c2.NL||0.001)+'">'+(c2.NL||'')+'</div></div>'+
        '<div class="leyenda">'+
        '<span><i style="background:var(--ok)"></i>Logrado '+Math.round(c2.L/base*100)+'%</span>'+
        '<span><i style="background:var(--alerta)"></i>Pendiente '+c2.P+'</span>'+
        '<span><i style="background:var(--mal)"></i>No logrado '+c2.NL+'</span>'+
        '<span style="color:var(--azul);font-weight:600">'+esc(c.f1)+': '+c1.L+' logrados</span></div></div>';
    }
    if(t.esNota){
      var ns = al.map(function(a){return val(a,t.id,'m1');}).filter(function(x){return typeof x==='number';});
      if(!ns.length) return '';
      var p=prom(ns), ap=ns.filter(function(n){return n>=4;}).length;
      var mn=Math.min.apply(null,ns), mx=Math.max.apply(null,ns);
      return '<div class="bloque"><div class="bh"><b>'+t.nom+'</b><span>'+ns.length+' evaluados</span></div>'+
        '<div class="bd"><div><b>'+fmt(p,1)+'</b>Promedio</div>'+
        '<div><b>'+Math.round(ap/ns.length*100)+'%</b>Aprobación</div>'+
        '<div><b>'+fmt(mn,1)+' – '+fmt(mx,1)+'</b>Rango</div></div>'+
        '<div class="barra"><i class="oro" style="width:'+Math.round(p/7*100)+'%"></i></div></div>';
    }
    var v1 = al.map(function(a){return val(a,t.id,'m1');}).filter(function(x){return typeof x==='number';});
    var v2 = al.map(function(a){return val(a,t.id,'m2');}).filter(function(x){return typeof x==='number';});
    if(!v1.length && !v2.length) return '';
    var p1=prom(v1), p2=prom(v2), cambio='';
    if(p1!==null && p2!==null){
      var d = t.mejor==='menor' ? p1-p2 : p2-p1;
      var pct = Math.abs(d/p1*100);
      cambio = '<span class="'+(d>0?'up':(d<0?'down':'eq'))+'" style="font-size:12px;font-weight:700">'+
        (d>0?'▲':(d<0?'▼':'='))+' '+pct.toFixed(1)+'%</span>';
    }
    var mej = al.filter(function(a){ var p=progreso(a,t); return p!==null && p>0; }).length;
    var con = al.filter(function(a){ return progreso(a,t)!==null; }).length;
    var u = t.uni ? ' '+t.uni : '';
    return '<div class="bloque"><div class="bh"><b>'+t.nom+'</b>'+(cambio||'<span>'+v1.length+' evaluados</span>')+'</div>'+
      '<div class="bd"><div><b>'+fmt(p1,t.dec)+u+'</b>'+esc(c.f1)+'</div>'+
      (p2!==null?'<div><b>'+fmt(p2,t.dec)+u+'</b>'+esc(c.f2)+'</div>':'')+
      (con?'<div><b>'+mej+'/'+con+'</b>Mejoraron</div>':'')+'</div>'+
      (con?'<div class="barra"><i style="width:'+Math.round(mej/con*100)+'%"></i></div>':'')+'</div>';
  }).join('');

  /* ranking */
  var t=T(testOn), rank='';
  if(t.id!=='plancha'){
    var k = (t.id==='salto'||t.id==='abdominales') ? 'm2' : 'm1';
    var arr = al.map(function(a){ var v=val(a,t.id,k); if(typeof v!=='number') v=val(a,t.id,'m1');
        return {n:a.nombre, v:v}; })
      .filter(function(x){ return typeof x.v==='number'; })
      .sort(function(x,y){ return t.mejor==='menor' ? x.v-y.v : y.v-x.v; })
      .slice(0,5);
    rank = arr.map(function(x,i){
      return '<div class="alumno" style="cursor:default"><div class="num" style="'+(i===0?'background:var(--oro);':'')+'">'+(i+1)+'</div>'+
        '<div class="nom">'+esc(x.n)+'</div><b style="color:var(--azul)">'+fmt(x.v,t.dec)+(t.uni?' '+t.uni:'')+'</b></div>';
    }).join('');
  }
  var chipsR = TESTS.filter(function(x){return x.id!=='plancha';}).map(function(x){
    return '<div class="chip-test '+(x.id===testOn?'on':'')+'" data-t="'+x.id+'">'+x.corto+'</div>'; }).join('');

  return '<div class="card"><h2>Resultados del curso</h2>'+
    '<p class="sub">'+esc(c.nombre)+' · '+al.length+' estudiantes · mediciones del '+esc(c.f1)+' y '+esc(c.f2)+'</p>'+
    bloques+'</div>'+
    (rank ? '<div class="card"><h2>Mejores marcas</h2><div class="tests">'+chipsR+'</div>'+rank+'</div>' : '');
}

/* ---------- FICHA ---------- */
function abrirFicha(id){
  var c=curso(), a=null;
  for(var i=0;i<c.alumnos.length;i++){ if(c.alumnos[i].id===id){ a=c.alumnos[i]; break; } }
  if(!a) return;
  var idx=c.alumnos.indexOf(a)+1;

  var bloques = TESTS.map(function(t){
    if(t.esNota){
      var n=val(a,t.id,'m1');
      return '<div class="bloque"><div class="bh"><b>'+t.nom+'</b>'+
        '<span class="pill '+colorNota(n)+'" style="font-size:15px;padding:4px 12px">'+(typeof n==='number'?fmt(n,1):'–')+'</span></div></div>';
    }
    if(t.id==='plancha'){
      var v1=val(a,'plancha','m1'), v2=val(a,'plancha','m2'), p=progreso(a,t);
      var pl=function(v){ var cl = v==='L'?'p-ok':(v==='NL'?'p-mal':(v==='P'?'p-med':'p-neutro'));
        return '<span class="pill '+cl+'">'+(v||'–')+'</span>'; };
      var txt = p===null?'':(p>0?'▲ mejora':(p<0?'▼ retrocede':'= se mantiene'));
      return '<div class="bloque"><div class="bh"><b>'+t.nom+'</b>'+
        '<span class="'+(p>0?'up':(p<0?'down':'eq'))+'" style="font-size:12px;font-weight:700">'+txt+'</span></div>'+
        '<div class="bd"><div>'+pl(v1)+'<span style="display:block;margin-top:4px">'+esc(c.f1)+'</span></div>'+
        '<div>'+pl(v2)+'<span style="display:block;margin-top:4px">'+esc(c.f2)+'</span></div></div></div>';
    }
    if(t.id==='velocidad'){
      var v=val(a,'velocidad','m1'), ev=val(a,'velocidad','ev');
      var pc=prom(c.alumnos.map(function(x){return val(x,'velocidad','m1');}));
      var cl = ev==='S'?'p-ok':(ev==='NS'?'p-mal':'p-neutro');
      var comp = (typeof v==='number' && pc!==null) ?
        '<div><b>'+(v<=pc?'Sobre':'Bajo')+'</b>el promedio</div>' : '';
      return '<div class="bloque"><div class="bh"><b>'+t.nom+'</b><span class="pill '+cl+'">'+(ev||'–')+'</span></div>'+
        '<div class="bd"><div><b>'+fmt(v,2)+' s</b>Su marca</div>'+
        '<div><b>'+fmt(pc,2)+' s</b>Curso</div>'+comp+'</div></div>';
    }
    var w1=val(a,t.id,'m1'), w2=val(a,t.id,'m2'), pr=progreso(a,t);
    var pcu=prom(c.alumnos.map(function(x){return val(x,t.id,'m2');}));
    var todos=c.alumnos.map(function(x){return val(x,t.id,'m2');}).filter(function(x){return typeof x==='number';});
    var max=todos.length?Math.max.apply(null,todos):1;
    var sig = pr===null?'':(pr>0?'▲ +'+fmt(Math.abs(pr),t.dec):(pr<0?'▼ −'+fmt(Math.abs(pr),t.dec):'= sin cambio'));
    return '<div class="bloque"><div class="bh"><b>'+t.nom+'</b>'+
      '<span class="'+(pr>0?'up':(pr<0?'down':'eq'))+'" style="font-size:12px;font-weight:700">'+sig+'</span></div>'+
      '<div class="bd"><div><b>'+fmt(w1,t.dec)+'</b>'+esc(c.f1)+'</div>'+
      '<div><b>'+fmt(w2,t.dec)+'</b>'+esc(c.f2)+'</div>'+
      '<div><b>'+fmt(pcu,t.dec)+'</b>Curso</div></div>'+
      (typeof w2==='number' && max ? '<div class="barra"><i style="width:'+Math.round(w2/max*100)+'%"></i></div>' : '')+'</div>';
  }).join('');

  var n=notaGlobal(a);
  document.getElementById('hoja').innerHTML =
    '<div class="hoja-h"><div class="num" style="background:var(--oro);width:30px;height:30px">'+idx+'</div>'+
    '<h3>'+esc(a.nombre)+'<br><small>'+esc(c.nombre)+' · Condición física 2026</small></h3>'+
    '<button class="cerrar" id="cerrarFicha">✕</button></div>'+
    '<div class="hoja-b">'+
    '<div class="kpis"><div class="kpi"><b>'+(typeof n==='number'?fmt(n,1):'–')+'</b><span>Promedio notas</span></div>'+
    '<div class="kpi"><b>'+fmt(val(a,'velocidad','m1'),2)+'</b><span>Velocidad (s)</span></div>'+
    '<div class="kpi"><b>'+fmt(val(a,'abdominales','m2'),0)+'</b><span>Abdominales</span></div></div>'+
    '<div class="card">'+bloques+'</div></div>';
  document.getElementById('velo').classList.add('on');
}
function cerrarFicha(){ document.getElementById('velo').classList.remove('on'); }

/* ======================= EXPORTAR ======================= */
function bajar(nombre, contenido, tipo){
  var b=new Blob([contenido],{type:tipo});
  var u=URL.createObjectURL(b);
  var a=document.createElement('a'); a.href=u; a.download=nombre;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(u);},2000);
}
function exportarCSV(){
  var c=curso();
  var co=function(v){ return (v===null||v===undefined)?'':String(v).replace('.',','); };
  var cab=['N°','Estudiante','Velocidad 20 m (s)','Logro velocidad',
    'Salto '+c.f1+' (cm)','Salto '+c.f2+' (cm)','Abdominales '+c.f1,'Abdominales '+c.f2,
    'Plancha '+c.f1,'Plancha '+c.f2,'Flexiones (nota)','Trote (nota)'];
  var filas=c.alumnos.map(function(a,i){
    return [i+1, a.nombre, co(val(a,'velocidad','m1')), val(a,'velocidad','ev')||'',
      co(val(a,'salto','m1')), co(val(a,'salto','m2')),
      co(val(a,'abdominales','m1')), co(val(a,'abdominales','m2')),
      val(a,'plancha','m1')||'', val(a,'plancha','m2')||'',
      co(val(a,'flexiones','m1')), co(val(a,'trote','m1'))];
  });
  var txt='\uFEFF'+[cab].concat(filas).map(function(f){
    return f.map(function(x){ return '"'+String(x).replace(/"/g,'""')+'"'; }).join(';');
  }).join('\r\n');
  bajar('Test condicion fisica - '+c.nombre+'.csv', txt, 'text/csv;charset=utf-8');
  toast('Planilla descargada');
}

/* ======================= EVENTOS ======================= */
document.addEventListener('click', function(e){
  var t=e.target;

  var nb=t.closest('nav button');
  if(nb){ tab=nb.getAttribute('data-tab'); filtro=''; render(); window.scrollTo(0,0); return; }

  var ch=t.closest('.chip-curso');
  if(ch){
    var cid=ch.getAttribute('data-c');
    if(cid==='nuevo'){
      var n=prompt('Nombre del nuevo curso:','1º Básico');
      if(n && n.trim()){ var nc=nuevoCurso(n.trim()); ST.cursos.push(nc); ST.activo=nc.id; guardar(); tab='datos'; render(); }
    } else { ST.activo=cid; filtro=''; guardar(); render(); }
    return;
  }

  var ct=t.closest('.chip-test');
  if(ct){ testOn=ct.getAttribute('data-t'); render(); return; }

  var st=t.closest('[data-set]');
  if(st){
    var p=st.getAttribute('data-set').split('|');
    var al=curso().alumnos, a=null;
    for(var i=0;i<al.length;i++){ if(al[i].id===p[0]){ a=al[i]; break; } }
    if(a){ setVal(a,p[1],p[2], val(a,p[1],p[2])===p[3] ? null : p[3]); render(); }
    return;
  }

  var fi=t.closest('[data-ficha]');
  if(fi){ abrirFicha(fi.getAttribute('data-ficha')); return; }
  if(t.id==='cerrarFicha' || t.id==='velo'){ cerrarFicha(); return; }

  if(t.id==='guardarCurso'){
    var c=curso();
    c.nombre=(document.getElementById('nomCurso').value||'').trim()||c.nombre;
    c.f1=(document.getElementById('f1').value||'').trim()||c.f1;
    c.f2=(document.getElementById('f2').value||'').trim()||c.f2;
    guardar(); render(); toast('Cambios guardados');
  }
  if(t.id==='addAlumnos'){
    var nom=(document.getElementById('nuevos').value||'').split('\n')
      .map(function(s){return s.trim();}).filter(function(s){return s;});
    if(!nom.length){ toast('Escribe al menos un nombre'); return; }
    nom.forEach(function(x){ curso().alumnos.push({id:uid('a'), nombre:x, d:{}}); });
    guardar(); tab='inicio'; render(); toast(nom.length+' estudiante(s) agregados');
  }
  if(t.id==='csv') exportarCSV();
  if(t.id==='imprimir') window.print();
  if(t.id==='backup'){ bajar('respaldo-condicion-fisica.json', JSON.stringify(ST), 'application/json'); toast('Respaldo descargado'); }
  if(t.id==='restaurar') document.getElementById('fileIn').click();
  if(t.id==='borrarAlumno'){
    var cc=curso();
    if(!cc.alumnos.length){ toast('Este curso no tiene estudiantes'); return; }
    var q=prompt('Escribe el número del estudiante a eliminar (1 a '+cc.alumnos.length+'):');
    var k=parseInt(q,10)-1;
    if(k>=0 && k<cc.alumnos.length && confirm('¿Eliminar a '+cc.alumnos[k].nombre+'?')){
      cc.alumnos.splice(k,1); guardar(); render(); toast('Estudiante eliminado');
    }
  }
  if(t.id==='reset'){
    if(confirm('Se borrarán todos los cursos y marcas registradas. ¿Continuar?')){
      ST=semilla(); guardar(); tab='inicio'; testOn='velocidad'; render(); toast('App restablecida');
    }
  }
});

document.addEventListener('input', function(e){
  var t=e.target;
  if(t.id==='buscar'){
    filtro=t.value; var pos=t.selectionStart; render();
    var n=document.getElementById('buscar');
    if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(err){} }
    return;
  }
  var d=t.getAttribute && t.getAttribute('data-in');
  if(d){
    var p=d.split('|'), al=curso().alumnos, a=null;
    for(var i=0;i<al.length;i++){ if(al[i].id===p[0]){ a=al[i]; break; } }
    if(!a) return;
    var v=pnum(t.value);
    if(v!==null && p[3]==='int') v=Math.round(v);
    if(v!==null && p[3]==='nota') v=Math.min(7, Math.max(1, v));
    setVal(a,p[1],p[2],v);
  }
});

document.addEventListener('change', function(e){
  if(e.target.id==='fileIn'){
    var f=e.target.files[0]; if(!f) return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(d && d.cursos){ ST=d; guardar(); tab='inicio'; render(); toast('Respaldo restaurado'); }
        else toast('El archivo no tiene el formato esperado');
      }catch(err){ toast('No se pudo leer el archivo'); }
    };
    r.readAsText(f);
  }
});

/* recalcula flechas de progreso al salir de un campo */
document.addEventListener('blur', function(e){
  if(e.target && e.target.getAttribute && e.target.getAttribute('data-in')) render();
}, true);

/* manifest para instalar en el iPhone */
(function(){
  var icon = "data:image/svg+xml," + encodeURIComponent(
    "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='#14304f'/><text y='330' x='256' text-anchor='middle' font-size='190' fill='#d4af37' font-family='Arial' font-weight='bold'>TCF</text></svg>");
  var man = {name:"Test de Condición Física · CJP2", short_name:"Cond. Física",
    start_url:".", display:"standalone", background_color:"#eef1f5", theme_color:"#14304f",
    icons:[{src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any"}]};
  var l=document.createElement('link'); l.rel='manifest';
  l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/json'}));
  document.head.appendChild(l);
  var a=document.createElement('link'); a.rel='apple-touch-icon'; a.href=icon; document.head.appendChild(a);
})();

document.addEventListener('click', function(e){
  var t=e.target; if(!t || !t.id) return;
  if(t.id==='sySave'){
    SY.url=(document.getElementById('syUrl').value||'').trim().replace(/\/+$/,'');
    SY.key=(document.getElementById('syKey').value||'').trim();
    SY.tabla=(document.getElementById('syTabla').value||'test_fisico').trim();
    SY.doc=(document.getElementById('syDoc').value||'cjp2-2026').trim();
    guardarSY(); render();
    if(syListo()){ toast('Conexión guardada'); bajar(true); } else toast('Falta la URL o la clave');
  }
  if(t.id==='syDown') bajar(true);
  if(t.id==='syUp') subir(true);
});

render();
if(syListo()){ badge('','Conectando…'); bajar(false); }
</script>
</body>
