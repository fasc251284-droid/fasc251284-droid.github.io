<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Test Físico">
<meta name="theme-color" content="#0f2b5b">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230f2b5b'/><circle cx='90' cy='50' r='20' fill='%23d4a017'/><path d='M60 120 Q90 90 120 120' stroke='%23fff' stroke-width='12' fill='none' stroke-linecap='round'/><path d='M70 140 L110 140' stroke='%23d4a017' stroke-width='10' stroke-linecap='round'/></svg>">
<title>Test de Condición Física v3</title>
<style>
:root{--azul:#0f2b5b;--azul2:#1b427f;--oro:#d4a017;--bg:#f3f5f9;--card:#fff;--linea:#dde3ee;--txt:#16233d;--txt2:#5d6a85;
  --ok:#1e8e5a;--okbg:#e3f5ec;--med:#b9821a;--medbg:#fdf3dc;--baj:#c2412f;--bajbg:#fbe6e2;--r:14px;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);
  font-size:15px;line-height:1.4;padding-bottom:calc(80px + env(safe-area-inset-bottom));}
header{background:linear-gradient(180deg,var(--azul) 0%,var(--azul2) 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  position:sticky;top:0;z-index:50;border-bottom:3px solid var(--oro);}
header .kicker{font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:#f6e2ad;font-weight:700}
header h1{margin:2px 0 0;font-size:18px;font-weight:700;letter-spacing:-.01em}
header .sub{font-size:12px;color:#c3d2ee;margin-top:2px}
main{padding:14px 14px 20px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--linea);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700}
.card h3{margin:10px 0 6px;font-size:13px;font-weight:700;color:var(--azul)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--txt2);margin:0 0 4px}
select,input[type=text],input[type=date],textarea{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;
  font-size:16px;font-family:inherit;background:#fff;color:var(--txt);margin-bottom:8px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--txt2) 50%),linear-gradient(135deg,var(--txt2) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
button{font-family:inherit;font-size:15px;border:0;border-radius:10px;padding:11px 14px;background:var(--azul);
  color:#fff;font-weight:600;cursor:pointer;margin-bottom:8px;width:100%}
button:active{opacity:.85}
button.oro{background:var(--oro);color:#3a2a00}
button.gh{background:transparent;color:var(--baj);border:1px solid var(--linea);opacity:.75}
.row{display:flex;gap:8px}.row>*{flex:1}
.alu{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea)}
.alu:last-child{border-bottom:0}
.alu .n{width:22px;font-size:11px;color:var(--txt2);font-variant-numeric:tabular-nums;font-weight:700}
.alu .nm{flex:1;font-size:13.5px;line-height:1.25;font-weight:600}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:12px;width:100%}
th,td{border:1px solid var(--linea);padding:6px;text-align:center;white-space:nowrap}
th{background:var(--azul);color:#fff;font-size:10.5px;font-weight:700}
th.gr{background:var(--oro);color:#3a2a00}
td.nm,th.nm{text-align:left;max-width:150px;font-size:11.5px;line-height:1.2;white-space:normal}
tbody tr:nth-child(even) td{background:#fafbfe}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));
  background:var(--txt);color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;
  z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:.95}
.hint{font-size:12px;color:var(--txt2);line-height:1.35;margin-top:8px}
.lvl{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}
.lvl.a{background:var(--okbg);color:var(--ok)}
.lvl.m{background:var(--medbg);color:var(--med)}
.lvl.b{background:var(--bajbg);color:var(--baj)}
.lvl.x{background:#eef1f6;color:var(--txt2)}
.delta{font-size:11px;font-weight:700;padding:0 4px}
.delta.up{color:var(--ok)}.delta.down{color:var(--baj)}.delta.eq{color:var(--txt2)}

/* chips de pruebas */
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 6px;margin-bottom:6px}
.chip{flex:0 0 auto;width:auto;margin:0;padding:9px 13px;font-size:12.5px;font-weight:600;border-radius:999px;
  background:#eef1f6;color:var(--txt2);border:1px solid var(--linea)}
.chip.on{background:var(--azul);color:#fff;border-color:var(--azul)}

/* asistencia: un solo botón que cicla */
.asi1{width:46px;padding:8px 0;margin:0;font-size:13px;font-weight:800;background:#eef1f6;color:#98a2b6;border:1px solid var(--linea)}
.asi1.on-P{background:var(--okbg);color:var(--ok);border-color:#b9e3cd}
.asi1.on-A{background:var(--bajbg);color:var(--baj);border-color:#f2c6bd}
.asi1.on-J{background:var(--medbg);color:var(--med);border-color:#efd9a8}

/* logrado / no logrado */
.lg{width:40px;padding:8px 0;margin:0 2px 0 0;font-size:11px;font-weight:800;background:#eef1f6;color:#98a2b6;border:1px solid var(--linea)}
.lg.on-L{background:var(--okbg);color:var(--ok);border-color:#b9e3cd}
.lg.on-NL{background:var(--bajbg);color:var(--baj);border-color:#f2c6bd}

.vin{width:62px;text-align:center;font-weight:700;font-size:13px;padding:7px 2px;margin:0;
  border:1px solid var(--linea);border-radius:8px}
.nin{width:130px;font-size:12px;padding:7px 8px;margin:0;border:1px solid var(--linea);border-radius:8px;text-align:left}
.hist{color:var(--txt2);font-size:11.5px}

.bar{height:9px;background:#eef1f6;border-radius:5px;overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:5px}
.sug{display:inline-block;font-size:9.5px;font-weight:800;color:var(--oro);margin-left:4px;vertical-align:middle}
.bco{display:block;width:100%;text-align:left;font-size:12.5px;font-weight:500;padding:9px 11px;margin:0 0 6px;
  background:#f7f9fc;color:var(--txt);border:1px solid var(--linea);line-height:1.3}
.bco.on{background:var(--okbg);border-color:#b9e3cd;color:var(--ok);font-weight:600}
.ada{padding:9px 0;border-bottom:1px solid var(--linea);font-size:12px}
.ada:last-child{border-bottom:0}

nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.97);
  backdrop-filter:saturate(180%) blur(12px);border-top:1px solid var(--linea);display:flex;
  padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;padding:5px 1px;font-size:9px;font-weight:600;color:var(--txt2);
  text-decoration:none;cursor:pointer;letter-spacing:-.01em}
nav a .ic{display:block;font-size:18px;line-height:1.3}
nav a.on{color:var(--azul)}

#print{display:none}
@media print{
  body{padding:0;background:#fff}
  header,nav,main,.toast{display:none!important}
  #print{display:block!important;padding:0;color:#000;font-size:11px}
  #print h1{font-size:15px;margin:0 0 2px}
  #print h2{font-size:12px;margin:14px 0 5px;border-bottom:1.5px solid #0f2b5b;padding-bottom:2px;color:#0f2b5b}
  #print .meta{font-size:10px;color:#444;margin-bottom:10px;border-bottom:2px solid #d4a017;padding-bottom:6px}
  #print table{width:100%;border-collapse:collapse;font-size:9.5px;margin-bottom:6px}
  #print th,#print td{border:1px solid #999;padding:3px 4px;text-align:center}
  #print th{background:#e8edf6}
  #print td.nm{text-align:left}
  #print .pie{margin-top:16px;font-size:9px;color:#555;border-top:1px solid #bbb;padding-top:5px}
  #print ul{margin:2px 0 8px 16px;padding:0}
  #print li{font-size:10px;margin-bottom:2px}
  @page{margin:12mm}
}
</style>
</head>
<body>

<header>
  <div class="kicker">Colegio Juan Pablo Segundo · Los Lagos</div>
  <h1>Test de Condición Física</h1>
  <div class="sub">5º a 8º Básico · 2026 · Prof. Felipe Sanhueza Cárdenas</div>
</header>

<main id="app"></main>

<nav>
  <a data-v="cursos"><span class="ic">👥</span>Cursos</a>
  <a data-v="evaluar"><span class="ic">📝</span>Evaluar</a>
  <a data-v="estudiante"><span class="ic">🏃</span>Estudiante</a>
  <a data-v="comparar"><span class="ic">📊</span>Comparar</a>
  <a data-v="adecuaciones"><span class="ic">⚙️</span>Adecuac.</a>
  <a data-v="datos"><span class="ic">☁️</span>Datos</a>
</nav>

<div class="toast" id="toast"></div>
<div id="print"></div>

<script>

const KEY='cjp2_tcf_v2';
const uid=()=>Math.random().toString(36).slice(2,9);
const hoy=()=>new Date().toISOString().slice(0,10);
const num=v=>{if(v===undefined||v===null||v==='')return null;const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x};
const fmt=(x,d=2)=>x===null||x===undefined?'—':x.toFixed(d).replace('.',',');
const esc=s=>String(s===undefined||s===null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fFecha=f=>{if(!f)return '—';const p=f.split('-');return p[2]+'/'+p[1]};

const D5=[["ARANZAVE MONTECINOS AMANDA"],["BARRIOS PARRA JOSÉ EMILIANO"],["CHÁVEZ AGUILERA MÍA BELLA"],
["CORNEJO KUSHNER EMMA ANTONIA"],["CORONADO CARMONA EMILY PASCAL"],["FUENTEALBA LEÓN ALEXA ANAÍS"],
["GAMBOA ESCOBAR AYLEEN ELIZABETH"],["JARAMILLO CHICO MAITE AINNARA"],["JARAMILLO FLORES ELIZABETH"],
["JOFRÉ CIFUENTES ANGELO ANTONIO"],["MANCILLA LEIVA DAVID ALONSO"],["OBANDO MOLINA MONSERRAT CRISTEL"],
["OSORIO MUÑOZ FRANCISCA PAZ"],["PAILAPICHÚN HERNÁNDEZ CATALINA"],["PEÑA ARANEDA EMMA IGNACIA"],
["PÉREZ SILVA FLORENCIA KATALINA"],["PÉREZ VERA DALMA YHIZEL"],["SÁEZ VILLEGAS JACOB ALEXSANDER"],
["SALDÍA ORTIZ JORGE MAXIMILIANO"],["SANTIBÁÑEZ SOMOZA MAITE ANYELINA"],["SOTO CEA MAYTE ISABEL"],
["VÁSQUEZ RIFFO SARAI ELIZABETH"],["SALGADO MARTINA"]];

function seed(){
  const db={
    tests:[
      {id:'vel',n:'Velocidad 20 m',ico:'⚡',tipo:'num',u:'s',mejor:'menor',c1:4.10,c2:4.70,evals:[]},
      {id:'sal',n:'Salto',ico:'🦘',tipo:'num',u:'cm',mejor:'mayor',c1:19,c2:14,evals:[]},
      {id:'abd',n:'Abdominales',ico:'💪',tipo:'num',u:'rep',mejor:'mayor',c1:19,c2:15,evals:[]},
      {id:'pla',n:'Plancha',ico:'🧘',tipo:'logro',op:['L','NL'],evals:[]},
      {id:'flex',n:'Flexiones de brazo',ico:'📏',tipo:'num',u:'rep',mejor:'mayor',c1:15,c2:10,evals:[]},
      {id:'tro',n:'Trote',ico:'🏃',tipo:'num',u:'rep',mejor:'mayor',c1:100,c2:70,evals:[]}
    ],
    cursos:[],adaptaciones:{},activo:null,alumno:null
  };
  const c5={id:uid(),n:'5º Básico',alumnos:[]};
  D5.forEach(f=>{c5.alumnos.push({id:uid(),n:f[0]})});
  db.cursos.push(c5);
  ['6º Básico','7º Básico','8º Básico'].forEach(n=>{db.cursos.push({id:uid(),n:n,alumnos:[]})});
  db.activo=c5.id;
  db.alumno=c5.alumnos[0].id;
  return db;
}

let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
if(!DB||!DB.cursos){DB=seed()}

/* Migración: datos antiguos siguen sirviendo */
function migrar(){
  if(!DB.adaptaciones)DB.adaptaciones={};
  DB.cursos.forEach(c=>{if(!c.alumnos)c.alumnos=[]});
  DB.tests.forEach(t=>{
    if(!t.evals)t.evals=[];
    t.evals.forEach(e=>{if(e.just===undefined)e.just=''});
  });
  const p=DB.tests.find(t=>t.id==='pla');
  if(p){p.tipo='logro';p.op=['L','NL'];p.evals.forEach(e=>{if(e.val==='P')e.val='NL'})}
  Object.keys(DB.adaptaciones).forEach(aid=>{
    const o=DB.adaptaciones[aid];
    Object.keys(o).forEach(tid=>{if(typeof o[tid]==='string')o[tid]=o[tid]?[o[tid]]:[]});
  });
  if(!DB.testSel||!DB.tests.find(t=>t.id===DB.testSel))DB.testSel=DB.tests[0].id;
  if(!DB.cmpTest||!DB.tests.find(t=>t.id===DB.cmpTest))DB.cmpTest=DB.tests[0].id;
  if(!DB.adTest||!DB.tests.find(t=>t.id===DB.adTest))DB.adTest=DB.tests[0].id;
}
migrar();

const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600)};
const curso=()=>DB.cursos.find(c=>c.id===DB.activo)||DB.cursos[0];
const test=id=>DB.tests.find(t=>t.id===id);

/* ══════════ SINCRONIZACIÓN SUPABASE ══════════ */
const CFGKEY='cjp2_tcf_cfg';
const DOC='cjp2_tcf_v2';
const TABLA='test_fisico';

let CFG={url:'https://oktinlfoxjdohjukhwqw.supabase.co',key:'',last:null,dev:null};
try{const c=JSON.parse(localStorage.getItem(CFGKEY));if(c&&typeof c==='object')CFG=Object.assign(CFG,c)}catch(e){}
if(!CFG.dev){CFG.dev='disp-'+Math.random().toString(36).slice(2,7)}

const saveCfg=()=>{try{localStorage.setItem(CFGKEY,JSON.stringify(CFG))}catch(e){}};
saveCfg();

const syOK=()=>!!(CFG.url&&CFG.key);
const syHdr=()=>({'apikey':CFG.key,'Authorization':'Bearer '+CFG.key,'Content-Type':'application/json'});
const syEnd=()=>CFG.url.replace(/\/+$/,'')+'/rest/v1/'+TABLA;

let _pushT=null,_syncing=false;
const save=()=>{
  try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast('No se pudo guardar')}
  if(syOK()&&navigator.onLine&&!_syncing){clearTimeout(_pushT);_pushT=setTimeout(()=>syPush(true),1800)}
};

let DIAG=null;

async function syTest(){
  DIAG=null;
  if(!syOK()){DIAG={ok:false,t:'Falta URL o clave',d:'Completa los dos campos y vuelve a guardar.'};return false}
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/i.test(CFG.url)){
    DIAG={ok:false,t:'URL con formato raro',d:'Debe quedar exactamente así: https://oktinlfoxjdohjukhwqw.supabase.co — sin barra al final, sin espacios.'};
    return false;
  }
  let r;
  try{r=await fetch(syEnd()+'?select=id&limit=1',{headers:syHdr()})}
  catch(e){
    DIAG={ok:false,t:'No hubo respuesta del servidor',d:'Causas: sin internet, la app abierta desde Archivos en vez de GitHub Pages, o el proyecto de Supabase pausado.',raw:String(e)};
    return false;
  }
  let cuerpo='';try{cuerpo=await r.text()}catch(e){}
  if(r.ok){DIAG={ok:true,t:'Conexión OK',d:'La tabla '+TABLA+' responde correctamente.'};return true}
  const map={
    401:['Clave rechazada','La clave anon/publishable no es válida. Cópiala de nuevo completa desde Settings → API Keys.'],
    403:['Permiso denegado (RLS)','La tabla tiene RLS activo pero sin política para anon. Corre de nuevo el bloque create policy.'],
    404:['Tabla no encontrada','No existe una tabla llamada '+TABLA+' en el esquema public.'],
    400:['Petición rechazada','Normalmente falta la columna id, data, device o updated_at.'],
    406:['Formato no aceptado','La tabla existe pero le faltan columnas del SQL.']
  };
  const m=map[r.status]||['Error '+r.status,'Respuesta inesperada del servidor.'];
  DIAG={ok:false,t:m[0],d:m[1],raw:(cuerpo||'').slice(0,300),code:r.status};
  return false;
}

async function syPush(silent){
  if(!syOK()){if(!silent)toast('Falta configurar la conexión');return false}
  if(!navigator.onLine){if(!silent)toast('Sin internet · guardado local');return false}
  _syncing=true;
  try{
    const fila=[{id:DOC,data:DB,device:CFG.dev,updated_at:new Date().toISOString()}];
    const r=await fetch(syEnd()+'?on_conflict=id',{
      method:'POST',
      headers:Object.assign(syHdr(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),
      body:JSON.stringify(fila)
    });
    if(!r.ok){const c=await r.text();const err=new Error(c);err.code=r.status;throw err}
    CFG.last=new Date().toISOString();saveCfg();
    DIAG={ok:true,t:'Datos subidos',d:'La copia en la nube quedó actualizada · '+new Date().toLocaleTimeString('es-CL')};
    if(!silent)toast('Datos subidos ✓');
    if(!silent&&VIEW==='datos')render();
    return true;
  }catch(e){
    console.error('syPush',e);
    DIAG={ok:false,t:'No se pudieron subir los datos',code:e.code||null,
      d:e.code===403?'RLS bloquea la escritura. Corre de nuevo el bloque create policy.'
        :e.code===401?'Clave rechazada. Cópiala completa desde Settings → API Keys.'
        :e.code===400?'Faltan columnas en la tabla. Vuelve a correr el SQL completo.'
        :'Revisa la conexión y vuelve a intentar.',
      raw:String(e.message||e).slice(0,300)};
    if(!silent){toast('Error al subir');if(VIEW==='datos')render()}
    return false;
  }finally{_syncing=false}
}

async function syPull(silent){
  if(!syOK()){if(!silent)toast('Falta configurar la conexión');return false}
  if(!navigator.onLine){if(!silent)toast('Sin internet');return false}
  try{
    const r=await fetch(syEnd()+'?id=eq.'+encodeURIComponent(DOC)+'&select=data,updated_at,device',{headers:syHdr()});
    if(!r.ok)throw new Error(r.status+' '+await r.text());
    const rows=await r.json();
    if(!rows.length){if(!silent)toast('Aún no hay datos en la nube');return false}
    const remoto=rows[0];
    if(!remoto.data||!remoto.data.cursos){if(!silent)toast('El registro de la nube está vacío');return false}
    const f=new Date(remoto.updated_at).toLocaleString('es-CL');
    if(!silent&&!confirm('Se reemplazarán los datos de ESTE dispositivo con la copia de la nube.\n\nGuardada: '+f+'\nDesde: '+(remoto.device||'—')+'\n\n¿Continuar?'))return false;
    _syncing=true;
    DB=remoto.data;migrar();
    try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
    CFG.last=remoto.updated_at;saveCfg();
    _syncing=false;
    if(!silent)toast('Datos descargados ✓');
    render();
    return true;
  }catch(e){
    console.error('syPull',e);
    if(!silent)toast('Error al bajar · revisa la clave');
    _syncing=false;
    return false;
  }
}

async function syBoot(){
  if(!syOK()||!navigator.onLine)return;
  try{
    const r=await fetch(syEnd()+'?id=eq.'+encodeURIComponent(DOC)+'&select=updated_at,device',{headers:syHdr()});
    if(!r.ok)return;
    const rows=await r.json();
    if(!rows.length)return;
    const rem=new Date(rows[0].updated_at).getTime();
    const loc=CFG.last?new Date(CFG.last).getTime():0;
    if(rem>loc+2000&&rows[0].device!==CFG.dev){
      if(confirm('Hay datos más recientes en la nube ('+new Date(rows[0].updated_at).toLocaleString('es-CL')+').\n\n¿Descargarlos ahora?')) syPull(true).then(()=>toast('Datos actualizados ✓'));
    }
  }catch(e){}
}
window.addEventListener('online',()=>{if(syOK()){toast('Conexión recuperada · subiendo');syPush(true)}});
/* ══════════ FIN SINCRONIZACIÓN ══════════ */

/* ══════════ NIVELES Y CÁLCULOS ══════════ */
function nivel(t,v){
  if(v===undefined||v===null||v==='')return 'x';
  if(t.tipo==='logro')return v==='L'?'a':'b';
  const x=num(v);if(x===null)return 'x';
  if(t.mejor==='menor')return x<=t.c1?'a':(x<=t.c2?'m':'b');
  return x>=t.c1?'a':(x>=t.c2?'m':'b');
}
const LTX={a:'Adecuado',m:'En desarrollo',b:'Requiere apoyo',x:'Sin registro'};
const LAB={a:'A',m:'M',b:'B',x:'—'};

/* evaluaciones de un estudiante en un test, ordenadas de más nueva a más vieja */
function evalsDe(t,aid){return (t.evals||[]).filter(e=>e.aid===aid&&(e.val!==''&&e.val!==undefined&&e.val!==null)).sort((a,b)=>b.fecha<a.fecha?-1:1)}
function ultima(t,aid){const l=evalsDe(t,aid);return l.length?l[0]:null}
function getEval(t,aid,fecha){return (t.evals||[]).find(e=>e.aid===aid&&e.fecha===fecha)}
function setEval(t,aid,fecha,patch){
  let e=getEval(t,aid,fecha);
  if(!e){e={aid,fecha,asist:'',val:'',just:''};t.evals.push(e)}
  Object.assign(e,patch);
  if(!e.asist&&!e.val&&!e.just)t.evals=t.evals.filter(x=>x!==e);
  save();
}
/* mejor marca de un estudiante en un test */
function mejor(t,aid){
  const l=evalsDe(t,aid);if(!l.length)return null;
  if(t.tipo==='logro')return l.some(e=>e.val==='L')?'L':'NL';
  const nums=l.map(e=>num(e.val)).filter(x=>x!==null);
  if(!nums.length)return null;
  return t.mejor==='menor'?Math.min.apply(null,nums):Math.max.apply(null,nums);
}
/* promedio de un test en un grupo de estudiantes */
function promedio(t,alumnos){
  if(t.tipo==='logro'){
    const con=alumnos.map(a=>ultima(t,a.id)).filter(Boolean);
    if(!con.length)return null;
    return con.filter(e=>e.val==='L').length/con.length*100;
  }
  const v=alumnos.map(a=>{const u=ultima(t,a.id);return u?num(u.val):null}).filter(x=>x!==null);
  if(!v.length)return null;
  return v.reduce((s,x)=>s+x,0)/v.length;
}
function textoValor(t,v){
  if(v===null||v===undefined||v==='')return '—';
  if(t.tipo==='logro')return v==='L'?'Logrado':'No logrado';
  return String(v).replace('.',',')+(t.u?' '+t.u:'');
}
/* reparto A / M / B de un test en un curso */
function reparto(t,alumnos){
  const r={a:0,m:0,b:0,x:0};
  alumnos.forEach(a=>{const u=ultima(t,a.id);r[u?nivel(t,u.val):'x']++});
  return r;
}

const adaptDe=(aid,tid)=>{const o=DB.adaptaciones[aid];return (o&&o[tid])?o[tid]:[]};
function toggleAdapt(aid,tid,txt){
  if(!DB.adaptaciones[aid])DB.adaptaciones[aid]={};
  if(!DB.adaptaciones[aid][tid])DB.adaptaciones[aid][tid]=[];
  const l=DB.adaptaciones[aid][tid];
  const i=l.indexOf(txt);
  if(i>=0)l.splice(i,1);else l.push(txt);
  if(!l.length)delete DB.adaptaciones[aid][tid];
  if(!Object.keys(DB.adaptaciones[aid]).length)delete DB.adaptaciones[aid];
  save();
}
function totalAdapt(aid){const o=DB.adaptaciones[aid];if(!o)return 0;return Object.values(o).reduce((s,l)=>s+l.length,0)}

let VIEW='cursos';

document.querySelectorAll('nav a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();VIEW=a.dataset.v;render()}));

function render(mantener){
  const y=window.scrollY;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===VIEW));
  const v={cursos:vCursos,evaluar:vEvaluar,estudiante:vEstudiante,comparar:vComparar,adecuaciones:vAdecuaciones,datos:vDatos};

  bind();

}

function vEstudiante(){
  const c=curso();

  if(!c.alumnos.find(a=>a.id===DB.alumno))DB.alumno=c.alumnos[0].id;

  let h=`<div class="card"><h2>Estudiante</h2>
    <select id="selAlu">${c.alumnos.map((x,i)=>`<option value="${x.id}" ${x.id===a.id?'selected':''}>${i+1}. ${esc(x.n)}</option>`).join('')}</select>
    <div class="row"><button id="antAlu" style="margin-bottom:0">← Anterior</button><button id="sigAlu" style="margin-bottom:0">Siguiente →</button></div>
  </div>`;

  h+=`<div class="card"><h2>${esc(a.n)}</h2><div class="hint" style="margin-top:0;margin-bottom:8px">${esc(c.n)}</div>`;
  DB.tests.forEach(t=>{
    const evs=evalsDe(t,a.id);
    h+=`<h3>${t.ico} ${esc(t.n)}</h3>`;
    if(!evs.length){h+=`<div style="font-size:12px;color:var(--txt2);margin-bottom:6px">Sin registro</div>`;return}
    h+=`<div class="tw"><table><thead><tr><th>Fecha</th><th>Asist.</th><th>Resultado</th><th>Nivel</th><th>Δ</th></tr></thead><tbody>`;
    evs.forEach((e,i)=>{
      const niv=nivel(t,e.val);
      let d='<td>—</td>';
      if(t.tipo!=='logro'&&i<evs.length-1){
        const x=num(e.val),y=num(evs[i+1].val);
        if(x!==null&&y!==null){
          const dif=x-y;
          const bueno=t.mejor==='menor'?dif<0:dif>0;
          const cls=dif===0?'eq':(bueno?'up':'down');
          d=`<td class="delta ${cls}">${dif>0?'+':''}${fmt(dif,1)}</td>`;
        }
      }
      h+=`<tr><td>${fFecha(e.fecha)}</td><td>${e.asist||'—'}</td><td>${esc(textoValor(t,e.val))}</td><td><span class="lvl ${niv}">${LAB[niv]}</span></td>${d}</tr>`;
    });
    h+=`</tbody></table></div>`;
    const ad=adaptDe(a.id,t.id);
    if(ad.length)h+=`<div class="hint" style="margin-top:4px">⚙ ${ad.length} adecuación(es) registrada(s)</div>`;
  });
  h+=`</div>`;

  h+=`<div class="card"><h2>Resumen y perfil</h2><div class="tw"><table><thead><tr><th class="nm">Prueba</th><th>Última</th><th>Mejor</th><th>Nivel</th></tr></thead><tbody>`;
  DB.tests.forEach(t=>{
    const u=ultima(t,a.id);const mj=mejor(t,a.id);const niv=u?nivel(t,u.val):'x';
    h+=`<tr><td class="nm">${t.ico} ${esc(t.n)}</td><td>${u?esc(textoValor(t,u.val)):'—'}</td><td>${mj!==null?esc(textoValor(t,mj)):'—'}</td><td><span class="lvl ${niv}">${LAB[niv]}</span></td></tr>`;
  });
  h+=`</tbody></table></div>
    <button class="oro" id="pdfAlu" style="margin-top:10px">📄 Informe individual (PDF)</button>
    <div class="hint">Se abre el diálogo de impresión de Safari. Elige <b>Guardar en Archivos</b> o <b>PDF</b>.</div>
  </div>`;
  return h;
}

/* ══════════ VISTA COMPARAR ══════════ */
function vComparar(){
  const c=curso();
  const t=test(DB.cmpTest);
  let h=`<div class="card"><h2>Comparar</h2>
    <div class="chips">${DB.tests.map(x=>`<button class="chip ${x.id===t.id?'on':''}" data-ct="${x.id}">${x.ico} ${esc(x.n)}</button>`).join('')}</div>
    <select id="selCursoC">${DB.cursos.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.n)}</option>`).join('')}</select>
  </div>`;

  /* Ranking dentro del curso */
  if(!c.alumnos.length){
    h+=`<div class="card"><div style="text-align:center;color:var(--txt2);padding:20px">Este curso no tiene estudiantes</div></div>`;
  }else{
    const filas=c.alumnos.map(a=>{
      const u=ultima(t,a.id);const mj=mejor(t,a.id);
      return {a,u,mj,niv:u?nivel(t,u.val):'x'};
    });
    const conDato=filas.filter(f=>f.mj!==null&&f.mj!==undefined);
    if(t.tipo==='logro'){
      conDato.sort((p,q)=>(q.mj==='L'?1:0)-(p.mj==='L'?1:0));
    }else{
      conDato.sort((p,q)=>t.mejor==='menor'?p.mj-q.mj:q.mj-p.mj);
    }
    const sinDato=filas.filter(f=>f.mj===null||f.mj===undefined);
    const nums=conDato.map(f=>f.mj).filter(x=>typeof x==='number');
    const mx=nums.length?Math.max.apply(null,nums):0, mn=nums.length?Math.min.apply(null,nums):0;

    h+=`<div class="card"><h2>${t.ico} ${esc(t.n)} · ${esc(c.n)}</h2>`;
    const r=reparto(t,c.alumnos);
    h+=`<div class="row" style="margin-bottom:10px">
      <div style="text-align:center;background:var(--okbg);border-radius:10px;padding:8px"><div style="font-size:18px;font-weight:800;color:var(--ok)">${r.a}</div><div style="font-size:10px;color:var(--ok);font-weight:700">Adecuado</div></div>
      <div style="text-align:center;background:var(--medbg);border-radius:10px;padding:8px"><div style="font-size:18px;font-weight:800;color:var(--med)">${r.m}</div><div style="font-size:10px;color:var(--med);font-weight:700">En desarrollo</div></div>
      <div style="text-align:center;background:var(--bajbg);border-radius:10px;padding:8px"><div style="font-size:18px;font-weight:800;color:var(--baj)">${r.b}</div><div style="font-size:10px;color:var(--baj);font-weight:700">Requiere apoyo</div></div>
      <div style="text-align:center;background:#eef1f6;border-radius:10px;padding:8px"><div style="font-size:18px;font-weight:800;color:var(--txt2)">${r.x}</div><div style="font-size:10px;color:var(--txt2);font-weight:700">Sin dato</div></div>
    </div>`;
    const pr=promedio(t,c.alumnos);
    h+=`<div class="hint" style="margin-top:0;margin-bottom:8px">${t.tipo==='logro'?'Porcentaje de logro del curso: <b>'+(pr===null?'—':fmt(pr,0)+'%')+'</b>':'Promedio del curso (última medición): <b>'+(pr===null?'—':fmt(pr,1)+(t.u?' '+t.u:''))+'</b>'}</div>`;

    h+=`<div class="tw"><table><thead><tr><th style="width:26px">#</th><th class="nm">Estudiante</th><th style="width:70px">Mejor</th><th style="width:80px">Comparación</th><th style="width:34px">Niv.</th></tr></thead><tbody>`;
    conDato.forEach((f,i)=>{
      let pct=0;
      if(t.tipo==='logro')pct=f.mj==='L'?100:6;
      else if(typeof f.mj==='number'){
        if(t.mejor==='menor')pct=mn>0?(mn/f.mj)*100:0;
        else pct=mx>0?(f.mj/mx)*100:0;
      }
      pct=Math.max(6,Math.min(100,pct));
      const col=f.niv==='a'?'var(--ok)':(f.niv==='m'?'var(--med)':'var(--baj)');
      h+=`<tr><td>${i+1}</td><td class="nm">${esc(f.a.n)}</td><td><b>${esc(textoValor(t,f.mj))}</b></td>
        <td><div class="bar"><i style="width:${pct.toFixed(0)}%;background:${col}"></i></div></td>
        <td><span class="lvl ${f.niv}">${LAB[f.niv]}</span></td></tr>`;
    });
    sinDato.forEach(f=>{h+=`<tr><td>—</td><td class="nm" style="color:var(--txt2)">${esc(f.a.n)}</td><td colspan="3" style="color:var(--txt2);font-size:11px">Sin registro</td></tr>`});
    h+=`</tbody></table></div></div>`;
  }

  /* Comparación entre cursos */
  h+=`<div class="card"><h2>Comparación por curso</h2>
    <div class="hint" style="margin-top:0;margin-bottom:8px">Promedio de la última medición de cada estudiante. En Plancha se muestra el porcentaje de logro.</div>
    <div class="tw"><table><thead><tr><th class="nm">Prueba</th>${DB.cursos.map(x=>`<th>${esc(x.n.replace(' Básico',''))}</th>`).join('')}</tr></thead><tbody>`;
  DB.tests.forEach(t=>{
    h+=`<tr><td class="nm">${t.ico} ${esc(t.n)}</td>`;
    DB.cursos.forEach(x=>{
      const p=promedio(t,x.alumnos);
      h+=`<td>${p===null?'—':(t.tipo==='logro'?fmt(p,0)+'%':fmt(p,1))}</td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table></div>
    <div class="tw" style="margin-top:8px"><table><thead><tr><th class="nm">Curso</th><th>Estudiantes</th><th>Registros</th></tr></thead><tbody>`;
  DB.cursos.forEach(x=>{
    const reg=DB.tests.reduce((s,t)=>s+(t.evals||[]).filter(e=>x.alumnos.some(a=>a.id===e.aid)).length,0);
    h+=`<tr><td class="nm">${esc(x.n)}</td><td>${x.alumnos.length}</td><td>${reg}</td></tr>`;
  });
  h+=`</tbody></table></div></div>`;

  h+=`<div class="card"><h2>Informes</h2>
    <button class="oro" id="pdfCurso">📄 Informe del curso (PDF)</button>

    <button id="pdfGeneral" style="opacity:.9">📄 Informe general de todos los cursos (PDF)</button>
    <div class="hint">Se abre el diálogo de impresión de Safari. Elige <b>Guardar en Archivos</b> o <b>PDF</b>. Si estás en la app instalada y no abre, abre la misma dirección en Safari.</div>
  </div>`;
  return h;
}

/* ══════════ INFORMES PDF ══════════ */
const CAB=(titulo,sub)=>`<h1>${esc(titulo)}</h1><div class="meta">Colegio Juan Pablo Segundo · Educación Física y Salud · 2026<br>
  ${esc(sub)}<br>Profesor: Felipe Sanhueza Cárdenas · Emitido el ${new Date().toLocaleDateString('es-CL')}</div>`;
const PIE=`<div class="pie">Niveles de desempeño: A = Adecuado · M = En desarrollo · B = Requiere apoyo · — = Sin registro.
  Los resultados corresponden a la última medición registrada de cada estudiante. Documento generado por la aplicación Test de Condición Física.</div>`;

function imprimir(html){
  const p=document.getElementById('print');
  p.innerHTML=html;
  setTimeout(()=>{window.print()},120);
}

function infCurso(c){
  let h=CAB('Informe de condición física por curso',c.n+' · '+c.alumnos.length+' estudiantes');
  h+=`<h2>Resultados por estudiante</h2><table><thead><tr><th>N°</th><th>Estudiante</th>${DB.tests.map(t=>`<th>${esc(t.n)}</th>`).join('')}</tr></thead><tbody>`;
  c.alumnos.forEach((a,i)=>{
    h+=`<tr><td>${i+1}</td><td class="nm">${esc(a.n)}</td>`;
    DB.tests.forEach(t=>{
      const u=ultima(t,a.id);const nv=u?nivel(t,u.val):'x';
      h+=`<td>${u?esc(textoValor(t,u.val)):'—'}<br><b>${LAB[nv]}</b></td>`;
    });
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  h+=`<h2>Síntesis por prueba</h2><table><thead><tr><th>Prueba</th><th>Promedio</th><th>Adecuado</th><th>En desarrollo</th><th>Requiere apoyo</th><th>Sin registro</th></tr></thead><tbody>`;
  DB.tests.forEach(t=>{
    const r=reparto(t,c.alumnos);const p=promedio(t,c.alumnos);
    h+=`<tr><td class="nm">${esc(t.n)}</td><td>${p===null?'—':(t.tipo==='logro'?fmt(p,0)+'%':fmt(p,1)+(t.u?' '+t.u:''))}</td><td>${r.a}</td><td>${r.m}</td><td>${r.b}</td><td>${r.x}</td></tr>`;
  });
  h+=`</tbody></table>`;
  const conAd=c.alumnos.filter(a=>totalAdapt(a.id));
  if(conAd.length){
    h+=`<h2>Estudiantes con adecuaciones</h2><ul>`;
    conAd.forEach(a=>{h+=`<li>${esc(a.n)} — ${totalAdapt(a.id)} adecuación(es)</li>`});
    h+=`</ul>`;
  }
  return h+PIE;
}

function infAlumno(c,a){
  let h=CAB('Informe individual de condición física',a.n+' · '+c.n);
  h+=`<h2>Resumen por prueba</h2><table><thead><tr><th>Prueba</th><th>Última medición</th><th>Mejor marca</th><th>Nivel</th><th>Mediciones</th></tr></thead><tbody>`;
  DB.tests.forEach(t=>{
    const u=ultima(t,a.id);const mj=mejor(t,a.id);const nv=u?nivel(t,u.val):'x';
    h+=`<tr><td class="nm">${esc(t.n)}</td><td>${u?esc(textoValor(t,u.val)):'—'}</td><td>${mj!==null&&mj!==undefined?esc(textoValor(t,mj)):'—'}</td><td>${LAB[nv]} · ${LTX[nv]}</td><td>${evalsDe(t,a.id).length}</td></tr>`;
  });
  h+=`</tbody></table>`;
  h+=`<h2>Historial de mediciones</h2>`;
  DB.tests.forEach(t=>{
    const evs=evalsDe(t,a.id);
    if(!evs.length)return;
    h+=`<table><thead><tr><th colspan="4" style="text-align:left">${esc(t.n)}</th></tr><tr><th>Fecha</th><th>Asistencia</th><th>Resultado</th><th>Nivel</th></tr></thead><tbody>`;
    evs.slice().reverse().forEach(e=>{
      h+=`<tr><td>${esc(e.fecha)}</td><td>${esc(e.asist||'—')}${e.just?' · '+esc(e.just):''}</td><td>${esc(textoValor(t,e.val))}</td><td>${LAB[nivel(t,e.val)]}</td></tr>`;
    });
    h+=`</tbody></table>`;
  });
  const o=DB.adaptaciones[a.id]||{};
  if(Object.keys(o).length){
    h+=`<h2>Adecuaciones curriculares aplicadas</h2>`;
    Object.keys(o).forEach(tid=>{
      const nom=tid==='general'?'General':(test(tid)?test(tid).n:tid);
      h+=`<div style="font-size:10px;font-weight:700;margin-top:4px">${esc(nom)}</div><ul>`;
      o[tid].forEach(txt=>{h+=`<li>${esc(txt)}</li>`});
      h+=`</ul>`;
    });
  }
  return h+PIE;
}

function infPrueba(c,t){
  let h=CAB('Informe por prueba: '+t.n,c.n+' · '+c.alumnos.length+' estudiantes');
  const filas=c.alumnos.map(a=>({a,u:ultima(t,a.id),mj:mejor(t,a.id)}));
  const con=filas.filter(f=>f.mj!==null&&f.mj!==undefined);
  if(t.tipo==='logro')con.sort((p,q)=>(q.mj==='L'?1:0)-(p.mj==='L'?1:0));
  else con.sort((p,q)=>t.mejor==='menor'?p.mj-q.mj:q.mj-p.mj);
  const sin=filas.filter(f=>f.mj===null||f.mj===undefined);
  h+=`<h2>Ordenado por mejor marca</h2><table><thead><tr><th>#</th><th>Estudiante</th><th>Última</th><th>Mejor</th><th>Nivel</th><th>Mediciones</th></tr></thead><tbody>`;
  con.forEach((f,i)=>{
    const nv=f.u?nivel(t,f.u.val):'x';
    h+=`<tr><td>${i+1}</td><td class="nm">${esc(f.a.n)}</td><td>${f.u?esc(textoValor(t,f.u.val)):'—'}</td><td>${esc(textoValor(t,f.mj))}</td><td>${LAB[nv]}</td><td>${evalsDe(t,f.a.id).length}</td></tr>`;
  });
  sin.forEach(f=>{h+=`<tr><td>—</td><td class="nm">${esc(f.a.n)}</td><td colspan="4">Sin registro</td></tr>`});
  h+=`</tbody></table>`;
  const r=reparto(t,c.alumnos);const p=promedio(t,c.alumnos);
  h+=`<h2>Síntesis</h2><table><tbody>
    <tr><th>Promedio del curso</th><td>${p===null?'—':(t.tipo==='logro'?fmt(p,0)+'% de logro':fmt(p,1)+(t.u?' '+t.u:''))}</td></tr>
    <tr><th>Adecuado</th><td>${r.a}</td></tr><tr><th>En desarrollo</th><td>${r.m}</td></tr>
    <tr><th>Requiere apoyo</th><td>${r.b}</td></tr><tr><th>Sin registro</th><td>${r.x}</td></tr>
  </tbody></table>`;
  return h+PIE;
}

function infGeneral(){
  let h=CAB('Informe general de condición física','Todos los cursos · 5º a 8º Básico');
  h+=`<h2>Promedios por curso y prueba</h2><table><thead><tr><th>Prueba</th>${DB.cursos.map(c=>`<th>${esc(c.n)}</th>`).join('')}</tr></thead><tbody>`;
  DB.tests.forEach(t=>{
    h+=`<tr><td class="nm">${esc(t.n)}${t.u?' ('+t.u+')':''}</td>`;
    DB.cursos.forEach(c=>{const p=promedio(t,c.alumnos);h+=`<td>${p===null?'—':(t.tipo==='logro'?fmt(p,0)+'%':fmt(p,1))}</td>`});
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  h+=`<h2>Distribución de niveles por curso</h2><table><thead><tr><th>Curso</th><th>Estudiantes</th><th>Adecuado</th><th>En desarrollo</th><th>Requiere apoyo</th><th>Sin registro</th></tr></thead><tbody>`;
  DB.cursos.forEach(c=>{
    const tot={a:0,m:0,b:0,x:0};
    DB.tests.forEach(t=>{const r=reparto(t,c.alumnos);tot.a+=r.a;tot.m+=r.m;tot.b+=r.b;tot.x+=r.x});
    h+=`<tr><td class="nm">${esc(c.n)}</td><td>${c.alumnos.length}</td><td>${tot.a}</td><td>${tot.m}</td><td>${tot.b}</td><td>${tot.x}</td></tr>`;
  });
  h+=`</tbody></table>`;
  return h+PIE;
}

function infAdapt(c){
  let h=CAB('Informe de adecuaciones curriculares',c.n);
  const con=c.alumnos.filter(a=>totalAdapt(a.id));
  if(!con.length)return h+'<p>Este curso no tiene adecuaciones registradas.</p>'+PIE;
  con.forEach(a=>{
    h+=`<h2>${esc(a.n)}</h2>`;
    const o=DB.adaptaciones[a.id]||{};
    Object.keys(o).forEach(tid=>{
      const nom=tid==='general'?'General':(test(tid)?test(tid).n:tid);
      const t=test(tid);const u=t?ultima(t,a.id):null;
      h+=`<div style="font-size:10px;font-weight:700;margin-top:4px">${esc(nom)}${u?' — último resultado: '+esc(textoValor(t,u.val)):''}</div><ul>`;
      o[tid].forEach(txt=>{h+=`<li>${esc(txt)}</li>`});
      h+=`</ul>`;
    });
  });
  return h+PIE;
}

/* ══════════ EVENTOS ══════════ */
function bind(){
  const $=id=>document.getElementById(id);
  const qs=sel=>document.querySelectorAll(sel);

  /* --- cursos --- */
  if($('selCurso'))$('selCurso').addEventListener('change',e=>{DB.activo=e.target.value;DB.alumno=null;DB.adAlu=null;save();render()});
  if($('addAlu'))$('addAlu').addEventListener('click',()=>{
    const n=$('nuevoAlu').value.trim();if(!n)return;
    curso().alumnos.push({id:uid(),n:n.toUpperCase()});save();render(true);toast('Estudiante agregado');
  });
  qs('[data-ver]').forEach(b=>b.addEventListener('click',()=>{DB.alumno=b.dataset.ver;save();VIEW='estudiante';render()}));
  qs('[data-del]').forEach(b=>b.addEventListener('click',()=>{
    const aid=b.dataset.del;const a=curso().alumnos.find(x=>x.id===aid);
    if(!a||!confirm('¿Eliminar a '+a.n+'? Se borran también sus resultados y adecuaciones.'))return;
    curso().alumnos=curso().alumnos.filter(x=>x.id!==aid);
    DB.tests.forEach(t=>{t.evals=(t.evals||[]).filter(e=>e.aid!==aid)});
    delete DB.adaptaciones[aid];save();render(true);
  }));

  /* --- evaluar --- */
  qs('[data-t]').forEach(b=>b.addEventListener('click',()=>{DB.testSel=b.dataset.t;save();render(true)}));
  if($('evalFecha'))$('evalFecha').addEventListener('change',e=>{EVF=e.target.value||hoy();render(true)});
  qs('[data-asi]').forEach(b=>b.addEventListener('click',()=>{
    const aid=b.dataset.asi;const t=test(DB.testSel);
    const e=getEval(t,aid,EVF);
    const ciclo=['','P','A','J'];
    const act=e?(e.asist||''):'';
    const sig=ciclo[(ciclo.indexOf(act)+1)%4];
    setEval(t,aid,EVF,{asist:sig});
    b.classList.remove('on-P','on-A','on-J');
    if(sig)b.classList.add('on-'+sig);
    b.textContent=sig||'·';
    const nin=document.querySelector('[data-just="'+aid+'"]');
    if(nin)nin.placeholder=(sig==='J'||sig==='A')?'Justificación':'—';
  }));
  qs('[data-val]').forEach(inp=>inp.addEventListener('input',()=>{
    const aid=inp.dataset.val;const t=test(DB.testSel);
    setEval(t,aid,EVF,{val:inp.value.trim()});
    const sp=document.getElementById('lv'+aid);
    if(sp){const nv=nivel(t,inp.value.trim());sp.className='lvl '+nv;sp.textContent=LAB[nv]}
  }));
  qs('[data-lg]').forEach(b=>b.addEventListener('click',()=>{
    const aid=b.dataset.lg;const v=b.dataset.val;const t=test(DB.testSel);
    const e=getEval(t,aid,EVF);
    const nuevo=(e&&e.val===v)?'':v;
    setEval(t,aid,EVF,{val:nuevo});
    document.querySelectorAll('[data-lg="'+aid+'"]').forEach(x=>x.classList.remove('on-L','on-NL'));
    if(nuevo)b.classList.add('on-'+nuevo);
  }));
  qs('[data-just]').forEach(inp=>inp.addEventListener('input',()=>{
    setEval(test(DB.testSel),inp.dataset.just,EVF,{just:inp.value});
  }));

  /* --- estudiante --- */
  if($('selAlu'))$('selAlu').addEventListener('change',e=>{DB.alumno=e.target.value;save();render(true)});
  if($('antAlu'))$('antAlu').addEventListener('click',()=>{
    const l=curso().alumnos;const i=l.findIndex(x=>x.id===DB.alumno);
    DB.alumno=l[(i-1+l.length)%l.length].id;save();render();
  });
  if($('sigAlu'))$('sigAlu').addEventListener('click',()=>{
    const l=curso().alumnos;const i=l.findIndex(x=>x.id===DB.alumno);
    DB.alumno=l[(i+1)%l.length].id;save();render();
  });
  if($('pdfAlu'))$('pdfAlu').addEventListener('click',()=>{
    const c=curso();const a=c.alumnos.find(x=>x.id===DB.alumno);
    imprimir(infAlumno(c,a));
  });

  /* --- comparar --- */
  qs('[data-ct]').forEach(b=>b.addEventListener('click',()=>{DB.cmpTest=b.dataset.ct;save();render(true)}));
  if($('selCursoC'))$('selCursoC').addEventListener('change',e=>{DB.activo=e.target.value;DB.alumno=null;DB.adAlu=null;save();render(true)});
  if($('pdfCurso'))$('pdfCurso').addEventListener('click',()=>imprimir(infCurso(curso())));
  if($('pdfPrueba'))$('pdfPrueba').addEventListener('click',()=>imprimir(infPrueba(curso(),test(DB.cmpTest))));
  if($('pdfGeneral'))$('pdfGeneral').addEventListener('click',()=>imprimir(infGeneral()));

  /* --- adecuaciones --- */
  if($('selAluAd'))$('selAluAd').addEventListener('change',e=>{DB.adAlu=e.target.value;save();render(true)});
  qs('[data-at]').forEach(b=>b.addEventListener('click',()=>{DB.adTest=b.dataset.at;save();render(true)}));
  qs('[data-bco]').forEach(b=>b.addEventListener('click',()=>{
    toggleAdapt(DB.adAlu,b.dataset.tid,b.dataset.bco);render(true);
  }));
  if($('addAdapt'))$('addAdapt').addEventListener('click',()=>{
    const d=$('descAdapt').value.trim();if(!d)return toast('Escribe la adecuación');
    toggleAdapt(DB.adAlu,DB.adTest,d);render(true);toast('Adecuación agregada');
  });
  qs('[data-quita]').forEach(b=>b.addEventListener('click',()=>{
    toggleAdapt(DB.adAlu,b.dataset.qt,b.dataset.quita);render(true);toast('Adecuación quitada');
  }));
  if($('pdfAdapt'))$('pdfAdapt').addEventListener('click',()=>imprimir(infAdapt(curso())));

  /* --- datos --- */
  if($('sySave'))$('sySave').addEventListener('click',async()=>{
    const u=$('syUrl').value.trim(),k=$('syKey').value.trim();
    if(!u||!k)return toast('Completa URL y clave');
    CFG.url=u.replace(/\/+$/,'');CFG.key=k;saveCfg();
    toast('Probando conexión…');
    const ok=await syTest();
    toast(ok?'Conexión OK ✓':'Revisa el detalle en pantalla');
    render();
  });
  if($('syUp'))$('syUp').addEventListener('click',()=>{toast('Subiendo…');syPush(false)});
  if($('syDown'))$('syDown').addEventListener('click',()=>syPull(false));
  if($('expJson'))$('expJson').addEventListener('click',()=>{
    const b=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='test-fisico-'+hoy()+'.json';document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
  });
  if($('impJson'))$('impJson').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d||!d.cursos||!d.tests)return toast('Archivo no válido');
        if(!confirm('Se reemplazarán los datos actuales por los del respaldo. ¿Continuar?'))return;
        DB=d;migrar();save();render();toast('Respaldo restaurado ✓');
      }catch(err){toast('No se pudo leer el archivo')}
    };
    rd.readAsText(f);
  });
  if($('resetAll'))$('resetAll').addEventListener('click',()=>{
    if(!confirm('Esto borra cursos, evaluaciones y adecuaciones de ESTE dispositivo.\nLa copia en la nube no se toca.\n\n¿Seguro?'))return;
    localStorage.removeItem(KEY);DB=seed();migrar();
    try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
    render();toast('Datos borrados');
  });
}

render();
syBoot();
</script>
</body>
</html>
